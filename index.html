<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>はじめのうた | 轟はじめ歌唱データベース</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page-title">
    <svg class="title-decor title-decor-left" viewBox="0 0 140 140" aria-hidden="true">
      <polygon class="decor-shape decor-triangle" points="-2,52 46,22 46,82" />
      <circle class="decor-shape decor-circle" cx="92" cy="38" r="20" />
      <polygon class="decor-shape decor-diamond" points="72,80 84,96 72,112 60,96" />
    </svg>
  
    <div class="title-content">
      <h1>
        はじめ<span class="small-no">の</span>うた
      </h1>
      <p class="subtitle">轟はじめ歌唱データベース</p>
    </div>
  
    <svg class="title-decor title-decor-right" viewBox="0 0 160 160" aria-hidden="true">
      <circle class="decor-shape decor-circle" cx="38" cy="44" r="16" />
      <polygon class="decor-shape decor-diamond" points="104,24 120,42 104,60 88,42" />
      <path class="decor-shape decor-plus" d="M92 70h-14M85 63v14" />
      <polygon class="decor-shape decor-triangle" points="70,116 104,96 104,136" />
    </svg>
  </div>
  <div class="search-wrapper">
   <input
    type="text"
    id="search"
    placeholder="曲名・アーティスト・作品名などで検索">
  </div>
  <div class="filter-area">

    <button
    type="button"
    id="filter-toggle"
    class="filter-toggle">
    <span class="filter-toggle-text">
        フィルター・並び替え
    </span>
    <span id="filter-toggle-icon">▼</span>
    </button>
   <div id="filter-content">

    <div class="filter-section">
      <div class="filter-title">フィルター</div>
      <div class="filter-options">
        <label><input type="checkbox" id="filter-first"> 初披露のみ</label>
        <label><input type="checkbox" id="filter-original"> オリジナル曲のみ</label>
        <label><input type="checkbox" id="filter-full"> フルのみ</label>
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-title">配信種類</div>
      <select id="filter-stream-type">
        <option value="all">すべて</option>
        <option value="karaoke">歌枠</option>
        <option value="live">ライブ</option>
        <option value="relay">歌枠リレー</option>
        <option value="collaboration">コラボ</option>
        <option value="event">イベント</option>
        <option value="others">その他</option>
      </select>
    </div>

    <div class="filter-section result-area">
    <div id="result-count" class="filter-title">
        🎵 検索結果：0件
    </div>
      <div class="sort-row">
        <label for="sort-order">並び替え</label>
        <select id="sort-order">
          <option value="newest">新しい順</option>
          <option value="oldest">古い順</option>
          <option value="title">曲名順</option>
          <option value="artist">アーティスト順</option>
        </select>
      </div>
    </div>
   </div>
  </div>
  </div>

  <div id="result">読み込み中...</div>
  <div id="modal-overlay" class="modal-overlay hidden" aria-hidden="true">
  <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">

    <div class="modal-header">
      <button
        type="button"
        class="modal-close"
        aria-label="閉じる">
        &times;
      </button>
    </div>

    <div class="modal-body">

      <div class="modal-thumbnail-wrap">

    <a
      id="modal-thumbnail-link"
      href="#"
      target="_blank"
      rel="noopener noreferrer">
      <img
          id="modal-thumbnail"
          class="modal-thumbnail"
          src=""
          alt="">
    </a>

      <div class="modal-info-grid">

        <div class="modal-info-card">
          <div class="modal-info-label">🎵 曲名</div>
          <div id="modal-song-title" class="modal-info-value"></div>
        </div>

        <div class="modal-info-card">
          <div class="modal-info-label">👤 アーティスト</div>
          <div id="modal-artist" class="modal-info-value"></div>
        </div>

      </div>

      <div class="modal-section">
        <div class="modal-section-title">
          配信情報
        </div>

        <div
          id="modal-stream-info"
          class="modal-section-list">
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-section-title">
          歌唱情報
        </div>

        <div
          id="modal-singing-info"
          class="modal-badge-group">
        </div>
      </div>

      <div
        id="modal-duet-partner-section"
        class="modal-section hidden">

        <div class="modal-section-title">
          デュエット相手
        </div>

        <div
          id="modal-duet-partner"
          class="modal-info-value">
        </div>

      </div>

    </div>

    <div class="modal-footer">
      <a
        id="modal-watch-button"
        class="modal-action-button"
        href="#"
        target="_blank"
        rel="noopener noreferrer">
        ▶ 配信を見る
      </a>
    </div>

  </div>
 </div>
  <script src="./app.js"></script>
</body>
</html>
