<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>はじめのうた | 轟はじめ歌唱データベース</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="page-title">
    <h1>はじめのうた</h1>
    <p class="subtitle">轟はじめ歌唱データベース</p>
  </div>

  <input type="text" id="search" placeholder="曲名・アーティスト・作品名などで検索">

  <div class="filter-area">
    <div class="filter-section">
      <div class="filter-title">フィルター</div>
      <div class="filter-options">
        <label><input type="checkbox" id="filter-first"> 初披露のみ</label>
        <label><input type="checkbox" id="filter-original"> オリジナル曲のみ</label>
        <label><input type="checkbox" id="filter-full"> フルのみ</label>
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-title">配信種類</div>
      <select id="filter-stream-type">
        <option value="all">すべて</option>
        <option value="karaoke">歌枠</option>
        <option value="live">ライブ</option>
        <option value="relay">歌枠リレー</option>
        <option value="collaboration">コラボ</option>
        <option value="event">イベント</option>
        <option value="others">その他</option>
      </select>
    </div>

    <div class="filter-section result-area">
      <div class="filter-title">検索結果</div>
      <div id="result-count">検索結果：0件</div>
      <div class="sort-row">
        <label for="sort-order">並び替え</label>
        <select id="sort-order">
          <option value="newest">新しい順</option>
          <option value="oldest">古い順</option>
          <option value="title">曲名順</option>
          <option value="artist">アーティスト順</option>
        </select>
      </div>
    </div>
  </div>

  <div id="result">読み込み中...</div>

  <script src="./app.js"></script>
</body>
</html>
